name: cyber-threat-hub

services:
  # Aplicação Node.js (API + frontend estático)
  app:
    image: ${IMAGE_NAME:-cyber-threat-hub}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${IMAGE_TAG:-local}
    restart: unless-stopped
    # Segredos vêm do ambiente (arquivo .env local ou GitHub Secrets na pipeline)
    environment:
      PORT: 3001
      DB_PATH: /app/data/database.sqlite
      SIMULATE_FAILURE: ${SIMULATE_FAILURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RANSOMWARE_LIVE_API_KEY: ${RANSOMWARE_LIVE_API_KEY:-}
      CVEFEED_API_KEY: ${CVEFEED_API_KEY:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    volumes:
      # Banco de dados SQLite persistido fora do container
      - db-data:/app/data
    expose:
      - "3001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Reverse proxy - único serviço exposto ao host
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-3002}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

volumes:
  db-data:

networks:
  backend:
