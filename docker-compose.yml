name: cyber-threat-hub

# Serviços da aplicação (sempre sobem):
#   docker compose up -d --build
# Stack de observabilidade (Prometheus, Loki, Alloy, Grafana) - perfil opcional:
#   docker compose --profile observability up -d --build
services:
  # Aplicação Node.js (API + frontend estático)
  app:
    image: ${IMAGE_NAME:-cyber-threat-hub}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${IMAGE_TAG:-local}
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    # Segredos vêm do ambiente (arquivo .env local ou GitHub Secrets na pipeline)
    environment:
      PORT: 3001
      DB_PATH: /app/data/database.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SIMULATE_FAILURE: ${SIMULATE_FAILURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RANSOMWARE_LIVE_API_KEY: ${RANSOMWARE_LIVE_API_KEY:-}
      CVEFEED_API_KEY: ${CVEFEED_API_KEY:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    labels:
      cth.logs: "true" # logs coletados pelo Grafana Alloy
    volumes:
      # Banco de dados SQLite persistido fora do container
      - db-data:/app/data
    expose:
      - "3001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Reverse proxy - único serviço da aplicação exposto ao host
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-3002}:80"
    labels:
      cth.logs: "true"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Observabilidade (profile "observability")
  # ---------------------------------------------------------------------------

  # Métricas: coleta GET /metrics da aplicação e avalia as regras de alerta
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Logs: armazenamento e consulta (LogQL)
  loki:
    image: grafana/loki:3.7.9
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - backend

  # Coletor: lê stdout/stderr dos containers com label cth.logs=true e envia ao Loki
  alloy:
    image: grafana/alloy:v1.21.2
    profiles: ["observability"]
    restart: unless-stopped
    # root apenas para ler o socket do Docker (somente leitura) - ver análise de riscos no README
    user: "0"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - backend

  # Dashboards: data sources e dashboard provisionados como código
  grafana:
    image: grafana/grafana:13.1.9
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Defina GRAFANA_ADMIN_PASSWORD no .env / GitHub Secrets. Sem ela, o Grafana usa
      # "admin" e obriga a troca no primeiro login.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Visualização sem login (somente leitura) para a demo; edição exige o admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cyber-threat-hub.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - backend

volumes:
  db-data:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  backend:
