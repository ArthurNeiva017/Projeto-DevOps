# Prometheus - coleta as métricas expostas pela aplicação em /metrics
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Aplicação Node.js (prom-client). Acesso pela rede interna do compose,
  # sem passar pelo nginx (que bloqueia /metrics para o mundo externo).
  - job_name: cyber-threat-hub
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["app:3001"]
        labels:
          service: app

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
