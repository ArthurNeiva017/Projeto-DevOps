# Reverse proxy na frente da aplicação Node.js (serviço "app" do docker-compose)
upstream cyber_threat_hub {
    server app:3001;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: segunda camada contra XSS - só scripts próprios e do CDN do Chart.js, sem inline
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        proxy_pass http://cyber_threat_hub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Métricas são internas: coletadas pelo Prometheus direto no container (rede backend)
    location = /metrics {
        return 404;
    }

    location = /api/health {
        proxy_pass http://cyber_threat_hub;
        access_log off;
    }
}
