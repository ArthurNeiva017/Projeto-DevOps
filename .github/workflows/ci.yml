name: CI/CD Pipeline

# Fluxos deste pipeline:
#   - push/PR na main ............ CI (testes + build + smoke test da imagem)
#   - tag vX.Y.Z ................. CI + publicação no GHCR + deploy homologação -> produção
#                                  (rollback automático se o health check falhar)
#   - Run workflow (manual):
#       operation=deploy  ........ igual à tag; rode sobre uma tag, com opção de simular falha
#       operation=rollback ....... volta um ambiente para a versão informada
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação"
        type: choice
        options: [ deploy, rollback ]
        default: deploy
      simulate_failure:
        description: "[deploy] Simular falha em homologação (demonstra o rollback automático)"
        type: boolean
        default: false
      environment:
        description: "[rollback] Ambiente"
        type: choice
        options: [ homologacao, producao ]
        default: homologacao
      version:
        description: "[rollback] Versão de destino (SemVer, ex: 1.0.0)"
        type: string
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: ci-cd-${{ github.ref }}-${{ inputs.operation || 'auto' }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # CI
  # ===========================================================================
  build-and-test:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Tests
        working-directory: ./backend
        run: npm test

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build Docker Image
        run: docker build --build-arg APP_VERSION=ci-${{ github.sha }} -t cyber-threat-hub:ci .

      - name: Smoke test do container
        run: |
          docker run -d --name cth-ci -p 3001:3001 cyber-threat-hub:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3001/api/health; then exit 0; fi
            sleep 3
          done
          docker logs cth-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f cth-ci || true

  # ===========================================================================
  # CD - publicação da imagem (somente em tags vX.Y.Z)
  # ===========================================================================
  build-and-push:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão e nome da imagem
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' não segue SemVer (vMAJOR.MINOR.PATCH)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Gerar tags SemVer da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          {
            echo "### 📦 Imagem publicada"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # CD - deploy em homologação (simulado) com rollback automático
  # ===========================================================================
  deploy-homologacao:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: homologacao
      url: http://localhost:8081
    env:
      IMAGE_NAME: ${{ needs.build-and-push.outputs.image }}
      VERSION: ${{ needs.build-and-push.outputs.version }}
      DEPLOY_ENV: homologacao
      # Segredos do environment "homologacao" (Settings > Environments)
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
      CVEFEED_API_KEY: ${{ secrets.CVEFEED_API_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessário para listar as tags anteriores

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Simular ambiente com a versão estável atual
        run: |
          chmod +x scripts/*.sh
          PREVIOUS=$(git tag --list 'v*.*.*' --sort=-v:refname | sed 's/^v//' | grep -vx "$VERSION" | head -n1 || true)
          if [ -n "$PREVIOUS" ] && docker manifest inspect "$IMAGE_NAME:$PREVIOUS" > /dev/null 2>&1; then
            echo "Versão estável atual: $PREVIOUS"
            scripts/deploy.sh "$PREVIOUS" "$DEPLOY_ENV"
          else
            echo "Sem versão anterior publicada - primeiro deploy do ambiente."
          fi

      - name: Deploy da nova versão
        id: deploy
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure && 'true' || 'false' }}
        run: scripts/deploy.sh "$VERSION" "$DEPLOY_ENV"

      - name: Rollback automático
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error::Deploy de $VERSION falhou em $DEPLOY_ENV. Executando rollback."
          scripts/rollback.sh "$DEPLOY_ENV"
          {
            echo "### ⏪ Rollback executado em $DEPLOY_ENV"
            echo '```'
            cat ".deploy/$DEPLOY_ENV/history.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo do deploy
        if: success()
        run: |
          {
            echo "### ✅ $VERSION implantada em $DEPLOY_ENV"
            echo '```'
            cat ".deploy/$DEPLOY_ENV/history.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # CD - deploy em produção (simulado), só após homologação OK
  # ===========================================================================
  deploy-producao:
    needs: [build-and-push, deploy-homologacao]
    runs-on: ubuntu-latest
    # Configure "Required reviewers" neste environment para exigir aprovação manual
    environment:
      name: producao
      url: http://localhost:8080
    env:
      IMAGE_NAME: ${{ needs.build-and-push.outputs.image }}
      VERSION: ${{ needs.build-and-push.outputs.version }}
      DEPLOY_ENV: producao
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
      CVEFEED_API_KEY: ${{ secrets.CVEFEED_API_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Simular ambiente com a versão estável atual
        run: |
          chmod +x scripts/*.sh
          PREVIOUS=$(git tag --list 'v*.*.*' --sort=-v:refname | sed 's/^v//' | grep -vx "$VERSION" | head -n1 || true)
          if [ -n "$PREVIOUS" ] && docker manifest inspect "$IMAGE_NAME:$PREVIOUS" > /dev/null 2>&1; then
            scripts/deploy.sh "$PREVIOUS" "$DEPLOY_ENV"
          fi

      - name: Deploy da nova versão
        id: deploy
        run: scripts/deploy.sh "$VERSION" "$DEPLOY_ENV"

      - name: Rollback automático
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error::Deploy de $VERSION falhou em $DEPLOY_ENV. Executando rollback."
          scripts/rollback.sh "$DEPLOY_ENV"
          cat ".deploy/$DEPLOY_ENV/history.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo do deploy
        if: success()
        run: echo "### ✅ $VERSION implantada em $DEPLOY_ENV" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Rollback manual (Run workflow > operation = rollback)
  # ===========================================================================
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      VERSION: ${{ inputs.version }}
      DEPLOY_ENV: ${{ inputs.environment }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
      CVEFEED_API_KEY: ${{ secrets.CVEFEED_API_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar versão
        run: |
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Informe uma versão SemVer válida no campo 'version' (recebido: '$VERSION')"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar se a imagem existe no registry
        run: docker manifest inspect "$IMAGE_NAME:$VERSION" > /dev/null

      - name: Executar rollback
        run: |
          chmod +x scripts/*.sh
          scripts/rollback.sh "$DEPLOY_ENV" "$VERSION"
          {
            echo "### ⏪ Rollback de $DEPLOY_ENV para $VERSION"
            echo "Disparado por: @${{ github.actor }}"
            echo '```'
            cat ".deploy/$DEPLOY_ENV/history.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
