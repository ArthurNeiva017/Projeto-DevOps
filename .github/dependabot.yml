# Dependabot: abre PRs automáticos com atualizações de segurança/versão.
# Cada PR passa pelo pipeline completo (testes + SAST + SCA + scan de contêiner).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    # Só sugere versões publicadas há pelo menos 7 dias (mitiga pacotes comprometidos)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Só sugere versões publicadas há pelo menos 7 dias (mitiga pacotes comprometidos)
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Só sugere versões publicadas há pelo menos 7 dias (mitiga pacotes comprometidos)
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
